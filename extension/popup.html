<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 290px; margin: 0; padding: 12px; color: #1b2420; }
    h1 { font-size: 15px; margin: 0 0 8px; color: #00966e; }
    label { display: block; margin: 5px 0; }
    input[type=text], input[type=time] { width: 100%; box-sizing: border-box; padding: 5px; }
    button { border: 0; border-radius: 8px; padding: 8px 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .verde { background: #00966e; color: #fff; }
    .sub { color: #66736d; font-size: 12px; }
    #est { margin-top: 10px; white-space: pre-wrap; background: #f3f5f4; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
  <h1>Retomazera Coletor</h1>
  <div class="sub">Coletar NESTE perfil do Chrome:</div>
  <label><input type="checkbox" id="whatsapp"> WhatsApp Web</label>
  <label><input type="checkbox" id="facebook"> Facebook (Marketplace)</label>
  <label><input type="checkbox" id="olx"> OLX (chat, "Vendendo")</label>
  <label><input type="checkbox" id="instagram"> Instagram (Direct da loja)</label>
  <label><input type="checkbox" id="avisos"> Avisar o progresso da coleta no Windows</label>
  <label>Nome deste perfil <input type="text" id="perfil" placeholder="ex.: João Luiz"></label>
  <label>Não coletar (nome exato como está salvo, ou telefone; um por linha)
    <textarea id="ignorar" rows="5" style="width:100%;box-sizing:border-box"></textarea></label>
  <label>Coletar a partir das (hora) <input type="number" id="horaMin" min="0" max="23" style="width:60px"></label>
  <label>Esperar depois de ligar o PC (min) <input type="number" id="espera" min="1" max="30" style="width:60px"></label>
  <div class="sub">A coleta automática roda 1x por dia, na primeira vez que o PC estiver ligado depois desse horário.</div>
  <label><input type="checkbox" id="ronda"> Rondas de 2 em 2 h (8h às 22h): só o que é novo, em segundo plano</label>
  <label><input type="checkbox" id="noite"> Coleta da noite (preparar as vendas de amanhã) a partir das
    <input type="number" id="horaNoite" min="15" max="23" style="width:50px"> h</label>
  <button class="verde" id="salvar">Salvar</button>
  <button id="agora">Coletar agora</button>
  <button id="agoraRonda">🔄 Ronda agora</button>
  <button id="agoraNoite">🌙 Coletar noite agora</button>
  <button id="testeMin">🧪 Testar coleta minimizada</button>
  <div id="est" class="sub"></div>
  <script src="popup.js"></script>
</body>
</html>
